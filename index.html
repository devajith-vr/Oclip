<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Clip</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">


    <!-- Notification Toast -->
    <div id="toast-container"></div>

    <!-- Dark Mode Toggle -->
    <button id="theme-toggle" class="btn-icon" style="position: fixed; top: 1rem; right: 1rem; z-index: 1000; background: var(--card-bg); box-shadow: var(--shadow-soft);" onclick="app.toggleTheme()">
        <i class="fa-solid fa-sun"></i>
    </button>

    <main id="app-container">
        
        <!-- VIEW 1: LOGIN -->
        <section id="view-login" class="view active">
            <div class="app-card login-box">
                <div class="logo-container">
                    <img src="favicon.png" alt="Logo" class="main-logo">
                    <h1>Online Clip</h1>
                    <p>Your instant workspace.</p>
                </div>
                
                <div class="login-interaction">
                    <!-- Profile Picture Upload -->
                    <div class="avatar-upload" onclick="document.getElementById('pfp-input').click()" title="Click to upload picture">
                        <img src="favicon.png" id="login-avatar" alt="Avatar">
                        <div class="avatar-overlay"><i class="fa-solid fa-pen"></i></div>
                    </div>
                    <input type="file" id="pfp-input" class="hidden" accept="image/*" onchange="app.handlePfpUpload(event)">

                    <!-- Simplified Name Input -->
                    <div class="input-wrapper mt-4">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="name-input" placeholder="What's your name?" onkeyup="app.updateAvatarInitial()" onkeydown="app.handleLoginKeyPress(event)" class="app-input" autocomplete="off">
                    </div>

                    <button class="btn btn-primary btn-large mt-4" onclick="app.initiateLogin()">
                        Join Session <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- VIEW 2: DASHBOARD -->
        <section id="view-dashboard" class="view hidden">
            <div class="top-nav">
                <div class="nav-brand">
                    <img src="favicon.png" alt="Logo" class="nav-logo">
                    <strong>Online Clip</strong>
                </div>
                <div class="nav-user">
                    <span id="nav-user-name">User</span>
                    <img src="favicon.png" alt="User" id="nav-user-avatar" class="nav-avatar">
                    <button class="btn-icon" onclick="app.logout()" title="Leave"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-header">
                    <h2>Hello, <span id="welcome-name" class="text-primary">User</span> 👋</h2>
                    <p>Start a new room or join your friends.</p>
                </div>

                <div class="action-cards">
                    <div class="action-card" onclick="app.createSession('1on1')">
                        <div class="card-icon"><i class="fa-solid fa-link"></i></div>
                        <h3>Create Room</h3>
                        <p>Generate a secure link</p>
                    </div>
                    <div class="action-card" onclick="app.createSession('group')">
                        <div class="card-icon"><i class="fa-solid fa-users"></i></div>
                        <h3>Group Room</h3>
                        <p>For up to 10 people</p>
                    </div>
                </div>

                <div class="join-box">
                    <h3>Have a code?</h3>
                    <div class="join-input-group">
                        <input type="text" id="join-otp-input" placeholder="Enter 6-digit code" maxlength="6" class="app-input text-center font-mono">
                        <button class="btn btn-primary" onclick="app.joinSession()">Join</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW 3: ACTIVE ROOM -->
        <section id="view-room" class="view hidden room-layout">
            <div class="top-nav">
                <div class="nav-brand">
                    <div class="live-indicator"></div>
                    <div>
                        <div class="room-title" id="room-type-title">Active Room</div>
                        <div class="room-code">Code: <strong id="current-otp" class="text-primary">---</strong></div>
                    </div>
                </div>
                <button class="btn btn-danger" onclick="app.leaveSession()">Leave Room</button>
            </div>

            <div class="room-work-area">
                <!-- Shared Clipboard -->
                <div class="app-card clipboard-panel">
                    <div class="panel-head">
                        <h3><i class="fa-regular fa-clipboard"></i> Clipboard</h3>
                        <button class="btn-icon" onclick="app.copyClipboard()" title="Copy"><i class="fa-regular fa-copy"></i></button>
                    </div>
                    <textarea id="shared-text" class="clipboard-textarea" placeholder="Type here... everyone in the room sees this instantly!"></textarea>
                </div>

                <!-- Chat & Files -->
                <div class="app-card chat-panel">
                    <div class="panel-head">
                        <h3><i class="fa-regular fa-comments"></i> Chat</h3>
                    </div>
                    
                    <div class="messages-container" id="chat-messages">
                        <!-- Messages go here -->
                    </div>
                    
                    <div class="chat-controls">
                        <input type="file" id="file-input" class="hidden" onchange="app.handleFileUpload(event)">
                        
                        <div class="chat-input-wrapper">
                            <button class="btn-icon attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            
                            <input type="text" id="chat-input" placeholder="Message..." class="app-input" onkeydown="app.handleChatKeyPress(event)">
                            
                            <button class="btn-icon emoji-btn" onclick="app.toggleStickers()" title="Stickers">
                                <i class="fa-regular fa-face-smile"></i>
                            </button>
                            
                            <button class="btn-primary send-btn" onclick="app.sendChatMessage()">
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                        
                        <!-- Stickers Menu -->
                        <div id="stickers-popup" class="stickers-menu hidden">
                            <span onclick="app.sendSticker('👍')">👍</span>
                            <span onclick="app.sendSticker('❤️')">❤️</span>
                            <span onclick="app.sendSticker('🔥')">🔥</span>
                            <span onclick="app.sendSticker('😂')">😂</span>
                            <span onclick="app.sendSticker('🚀')">🚀</span>
                            <span onclick="app.sendSticker('🎉')">🎉</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>



    </main>

    <script src="app.js"></script>
</body>
</html>
